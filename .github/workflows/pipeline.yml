name: pipeline

# agents is a catalog: two marketplace manifests and a README index, with no
# build artifact, no package, and no code to test. The pipeline exists to render
# the README badges on tag pushes.
on:
  push:
    tags:
      - "v*"

jobs:
  badges:
    if: github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/create-badges.yml@master
